dataset:
  data_dir: "artifacts/task1/data"
  index_dir: "artifacts/task1/indexes"

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    top_k: 100
  dense:
    top_k: 80
  memory:
    min_similarity: 0.82
    top_k: 10
  exact:
    top_k: 10
  fusion:
    rrf_k: 60
    weights:
      bm25: 1.0
      dense: 1.5
      memory: 2.0
      exact: 3.0
