dataset:
  name: "task1_canonical"
  version: "v1"
  raw_contexts_dir: "selected-contexts"
  train_json: "train.json"
  output_dir: "data/task1_canonical/v1"
  chunking:
    micro_target_tokens: [100, 250]
    macro_target_tokens: [400, 800]
    overlap_chars: 150
  normalization:
    unicode: "NFC"
    preserve_legal_ids: true
